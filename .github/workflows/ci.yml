name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stylelint
        run: npx --yes stylelint@16.25.0 theme.css
      - name: Validate manifest
        run: node -e "const m=require('./manifest.json'); for (const k of ['name','version','minAppVersion','author']) if(!m[k]) throw new Error('manifest missing '+k); console.log(m.name, m.version)"

  screenshots:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Render light / dark screenshots
        run: node tests/screenshot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/out/*.png
